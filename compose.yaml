services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logs_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logs_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      RETENTION_DAYS: "${RETENTION_DAYS:-30}"
      RETENTION_BATCH_SIZE: "${RETENTION_BATCH_SIZE:-1000}"
      RETENTION_SWEEP_INTERVAL_MS: "${RETENTION_SWEEP_INTERVAL_MS:-60000}"
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/logs_db
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data: